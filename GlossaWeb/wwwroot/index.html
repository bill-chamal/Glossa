<!DOCTYPE html>
<html lang="el" data-theme="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Glossa IDE — Γλώσσα WebAssembly</title>
    <base href="/" />
    
    <!-- PWA & Mobile Meta -->
    <meta name="theme-color" content="#007acc" />
    <meta name="description" content="Modern Blazor WebAssembly educational IDE for ΓΛΩΣΣΑ programming language" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Google Fonts: JetBrains Mono & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Segoe+UI:wght@400;600;700&display=swap" rel="stylesheet" />

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <!-- IDE Stylesheet -->
    <link rel="stylesheet" href="css/app.css" />

    <!-- Monaco Editor Loader -->
    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>
<body>
    <div id="app">
        <div class="app-boot-container">
            <div class="app-boot-logo">
                <svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="64" height="64" rx="14" fill="#007ACC" />
                    <path d="M18 46V18H32C36.4 18 39.8 19.3 42.2 21.9C44.6 24.5 45.8 28 45.8 32.4C45.8 36.8 44.6 40.3 42.2 42.8C39.8 45.3 36.4 46 32 46H18ZM25.2 40.2H31.8C34.4 40.2 36.3 39.6 37.6 38.3C38.9 37 39.5 35 39.5 32.4C39.5 29.8 38.9 27.8 37.6 26.5C36.3 25.2 34.4 24.6 31.8 24.6H25.2V40.2Z" fill="white"/>
                </svg>
            </div>
            <div class="app-boot-title">Glossa IDE</div>
            <div class="app-boot-subtitle">Blazor WebAssembly • Γλώσσα Runtime</div>
            <div class="app-boot-spinner"></div>
            <div class="app-boot-status">Booting WebAssembly environment...</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        <span class="error-text"><i class="bi bi-exclamation-triangle-fill"></i> An unexpected application error occurred.</span>
        <a href="" class="reload"><i class="bi bi-arrow-clockwise"></i> Reload</a>
        <a class="dismiss"><i class="bi bi-x-lg"></i></a>
    </div>

    <!-- Scripts: Compiler Bundle & Interop Bridges -->
    <script src="js/glo.bundle.js"></script>
    <script src="js/glo-bridge.js"></script>
    <script src="js/editor-interop.js"></script>
    <script src="js/file-interop.js"></script>

    <!-- Blazor WASM Runtime -->
    <script src="_framework/blazor.webassembly.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
